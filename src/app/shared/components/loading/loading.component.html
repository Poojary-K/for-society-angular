@if (isLoading()) {
  <div [class]="'loading-overlay' + (fullScreen ? ' loading-fullscreen' : '')">
    <div class="loading-brand" aria-hidden="true">
      <div
        class="loading-logo"
        role="img"
        aria-hidden="true"
        [style.background-image]="appLogoBackground"
      ></div>
    </div>
  </div>
}
